<svg xmlns="http://www.w3.org/2000/svg" width="340" height="200" viewBox="0 0 340 200">
  <style>
    * {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Ubuntu, "Helvetica Neue", Sans-Serif;
    }
    @keyframes pulseDonut {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.02); }
    }
    .donut-group {
      transform-origin: 230px 80px;
      animation: pulseDonut 4s ease-in-out infinite;
    }
    .lang-item {
      font-size: 14px;
      font-weight: 600;
      fill: #38bdae;
    }
    .lang-pct {
      font-size: 12px;
      font-weight: 500;
      fill: #94a3b8;
    }
  </style>

  <g class="gpsc-root">
    <!-- Card Background -->
    <rect x="1" y="1" rx="8" ry="8" height="198" width="338" stroke="#1a1b27" stroke-width="1" fill="#1a1b27" />

    <!-- Card Title -->
    <text x="30" y="38" font-size="22px" font-weight="600" fill="#70a5fd">Top Languages</text>

    <g transform="translate(0,40)">
      <!-- Left side: Legend -->
      <g transform="translate(30,0)">
        <!-- Python -->
        <g transform="translate(0, 10)">
          <rect width="14" height="14" rx="3" fill="#3572A5" stroke="#1a1b27" stroke-width="1.5" />
          <text x="24" y="12" class="lang-item">Python <tspan class="lang-pct">(50%)</tspan></text>
        </g>

        <!-- C++ -->
        <g transform="translate(0, 36)">
          <rect width="14" height="14" rx="3" fill="#F34B7D" stroke="#1a1b27" stroke-width="1.5" />
          <text x="24" y="12" class="lang-item">C++ <tspan class="lang-pct">(30%)</tspan></text>
        </g>

        <!-- C -->
        <g transform="translate(0, 62)">
          <rect width="14" height="14" rx="3" fill="#599CD4" stroke="#1a1b27" stroke-width="1.5" />
          <text x="24" y="12" class="lang-item">C <tspan class="lang-pct">(20%)</tspan></text>
        </g>
      </g>

      <!-- Right side: Donut Chart -->
      <g transform="translate(230, 75)" class="donut-group">
        <!-- Python (50%) -->
        <path d="M 0.00 -60.00 A 60 60 0 0 1 0.00 60.00 L 0.00 35.00 A 35 35 0 0 0 0.00 -35.00 Z" fill="#3572A5" stroke="#1a1b27" stroke-width="2">
          <title>Python: 50%</title>
        </path>
        <!-- C++ (30%) -->
        <path d="M 0.00 60.00 A 60 60 0 0 1 -57.06 -18.54 L -33.29 -10.82 A 35 35 0 0 0 0.00 35.00 Z" fill="#F34B7D" stroke="#1a1b27" stroke-width="2">
          <title>C++: 30%</title>
        </path>
        <!-- C (20%) -->
        <path d="M -57.06 -18.54 A 60 60 0 0 1 -0.01 -60.00 L -0.01 -35.00 A 35 35 0 0 0 -33.29 -10.82 Z" fill="#599CD4" stroke="#1a1b27" stroke-width="2">
          <title>C: 20%</title>
        </path>
      </g>
    </g>
  </g>
</svg>
