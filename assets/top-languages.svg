<svg xmlns="http://www.w3.org/2000/svg" width="350" height="215" viewBox="0 0 350 215" fill="none">
  <defs>
    <!-- Gradients for Progress Bars -->
    <linearGradient id="pyGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3572A5" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <linearGradient id="cppGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" />
      <stop offset="100%" stop-color="#F34B7D" />
    </linearGradient>

    <linearGradient id="cGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#70A5FD" />
      <stop offset="100%" stop-color="#00F5D4" />
    </linearGradient>

    <style>
      .card-bg {
        fill: #1A1B27;
        stroke: #2A2E42;
        stroke-width: 1.5;
        rx: 10px;
      }
      .title {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
        font-size: 18px;
        font-weight: 700;
        fill: url(#titleGrad);
        letter-spacing: 0.5px;
      }
      .badge-text {
        font-family: 'SF Mono', Monaco, Consolas, monospace;
        font-size: 11px;
        font-weight: 600;
        fill: #00F5D4;
      }
      .lang-name {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Ubuntu, sans-serif;
        font-size: 13px;
        font-weight: 600;
        fill: #E2E8F0;
      }
      .lang-pct {
        font-family: 'SF Mono', Monaco, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
        fill: #94A3B8;
      }
      .bar-track {
        fill: #24283B;
        rx: 3.5px;
      }
      .bar-fill {
        rx: 3.5px;
      }
      @keyframes expandBar1 {
        from { width: 0; }
        to { width: 160px; }
      }
      @keyframes expandBar2 {
        from { width: 0; }
        to { width: 73px; }
      }
      @keyframes expandBar3 {
        from { width: 0; }
        to { width: 57px; }
      }
      .anim-bar1 { animation: expandBar1 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .anim-bar2 { animation: expandBar2 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
      .anim-bar3 { animation: expandBar3 1.2s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    </style>
  </defs>

  <!-- Background Card -->
  <rect width="350" height="215" class="card-bg" />

  <!-- Header Section -->
  <g transform="translate(25, 30)">
    <!-- Cyan pulsing status dot -->
    <circle cx="4" cy="-4" r="4.5" fill="#00F5D4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="18" y="0" class="title">Top Languages</text>

    <!-- Top Languages Badge -->
    <rect x="220" y="-14" width="75" height="20" rx="10" fill="#24283B" stroke="#00F5D4" stroke-opacity="0.3" stroke-width="1" />
    <text x="257" y="0" text-anchor="middle" class="badge-text">ACTIVE</text>
  </g>

  <!-- Segmented Language Distribution Bar -->
  <g transform="translate(25, 48)">
    <rect width="300" height="7" rx="3.5" fill="#24283B" />
    <rect width="165" height="7" rx="3.5" fill="url(#pyGrad)" />
    <rect x="167" width="74" height="7" rx="3.5" fill="url(#cppGrad)" />
    <rect x="243" width="57" height="7" rx="3.5" fill="url(#cGrad)" />
  </g>

  <!-- Language 1: Python -->
  <g transform="translate(25, 78)">
    <circle cx="5" cy="5" r="4.5" fill="#00F5D4" />
    <text x="18" y="9" class="lang-name">Python</text>
    <text x="300" y="9" text-anchor="end" class="lang-pct">55.0%</text>
    <rect y="16" width="300" height="7" class="bar-track" />
    <rect y="16" width="165" height="7" class="bar-fill anim-bar1" fill="url(#pyGrad)" />
  </g>

  <!-- Language 2: C++ -->
  <g transform="translate(25, 122)">
    <circle cx="5" cy="5" r="4.5" fill="#F34B7D" />
    <text x="18" y="9" class="lang-name">C++</text>
    <text x="300" y="9" text-anchor="end" class="lang-pct">25.0%</text>
    <rect y="16" width="300" height="7" class="bar-track" />
    <rect y="16" width="75" height="7" class="bar-fill anim-bar2" fill="url(#cppGrad)" />
  </g>

  <!-- Language 3: C -->
  <g transform="translate(25, 166)">
    <circle cx="5" cy="5" r="4.5" fill="#38BDF8" />
    <text x="18" y="9" class="lang-name">C</text>
    <text x="300" y="9" text-anchor="end" class="lang-pct">20.0%</text>
    <rect y="16" width="300" height="7" class="bar-track" />
    <rect y="16" width="60" height="7" class="bar-fill anim-bar3" fill="url(#cGrad)" />
  </g>
</svg>
