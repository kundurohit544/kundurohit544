<svg width="100%" height="270" viewBox="0 0 850 270" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0A0E1A" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>

    <!-- Neon Text Gradient -->
    <linearGradient id="cyberTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" />
      <stop offset="45%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <!-- Cyber Grid Pattern -->
    <pattern id="cyberGrid" width="26" height="26" patternUnits="userSpaceOnUse">
      <path d="M 26 0 L 0 0 0 26" fill="none" stroke="#00F5D4" stroke-opacity="0.06" stroke-width="1" />
    </pattern>

    <!-- Ambient Neon Glow Spheres -->
    <radialGradient id="cyanOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#9333EA" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#9333EA" stop-opacity="0" />
    </radialGradient>

    <style>
      .mono-font {
        font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Courier New', monospace;
      }
      .sans-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
      }
      @keyframes pulseText {
        0%, 100% { filter: drop-shadow(0 0 10px rgba(0, 245, 212, 0.4)); }
        50% { filter: drop-shadow(0 0 20px rgba(0, 245, 212, 0.75)); }
      }
      @keyframes blinkDot {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.35; }
      }
      .title-name {
        font-weight: 900;
        font-size: 46px;
        letter-spacing: 2px;
        fill: url(#cyberTextGrad);
        animation: pulseText 4s ease-in-out infinite;
      }
      .status-dot {
        animation: blinkDot 2s infinite ease-in-out;
      }
    </style>
  </defs>

  <!-- Container Box with Rounded Corners -->
  <rect x="1" y="1" width="848" height="268" rx="12" fill="url(#bgGrad)" stroke="#162032" stroke-width="1.5" />

  <!-- Cyber Grid Overlay -->
  <rect x="1" y="1" width="848" height="268" rx="12" fill="url(#cyberGrid)" />

  <!-- Ambient Glow Spheres (Cyan left, Purple right) -->
  <circle cx="160" cy="135" r="150" fill="url(#cyanOrb)" />
  <circle cx="720" cy="135" r="160" fill="url(#purpleOrb)" />

  <!-- HUD Corner Brackets (Cyan Top, Purple Bottom) -->
  <path d="M 14 34 L 14 14 L 34 14" stroke="#00F5D4" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M 816 14 L 836 14 L 836 34" stroke="#00F5D4" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M 14 236 L 14 256 L 34 256" stroke="#A855F7" stroke-width="2.2" stroke-linecap="round" fill="none" />
  <path d="M 816 256 L 836 256 L 836 236" stroke="#A855F7" stroke-width="2.2" stroke-linecap="round" fill="none" />

  <!-- TOP LEFT HUD PILL: System Status -->
  <g transform="translate(30, 20)">
    <rect width="320" height="26" rx="5" fill="#0B1220" stroke="#1E2E4A" stroke-width="1.2" />
    <circle cx="14" cy="13" r="3.5" fill="#10B981" class="status-dot" />
    <text x="25" y="17" class="mono-font" font-size="11px" font-weight="700" fill="#64748B" letter-spacing="0.8px">
      SYSTEM: <tspan fill="#00F5D4">ONLINE</tspan> <tspan fill="#334155">|</tspan> <tspan fill="#94A3B8">AI &amp; ML ENGINEER</tspan>
    </text>
  </g>

  <!-- TOP RIGHT HUD PILL: Hireable -->
  <g transform="translate(662, 20)">
    <rect width="158" height="26" rx="5" fill="#0B1220" stroke="#00F5D4" stroke-opacity="0.4" stroke-width="1.2" />
    <circle cx="14" cy="13" r="3.5" fill="#00F5D4" class="status-dot" />
    <text x="25" y="17" class="mono-font" font-size="11px" font-weight="700" fill="#00F5D4" letter-spacing="0.5px">
      HIREABLE <tspan fill="#64748B" font-size="10px">v2.4.0_PROD</tspan>
    </text>
  </g>

  <!-- LEFT HERO SECTION -->
  <g transform="translate(30, 78)">
    <!-- Tech Pre-Heading -->
    <text x="0" y="0" class="mono-font" font-size="12px" font-weight="700" fill="#00F5D4" letter-spacing="1.5px">
      INITIALIZING DIGITAL BUILDER INTERFACE //
    </text>

    <!-- Main Glowing Name -->
    <text x="0" y="46" class="sans-font title-name">ROHIT KUNDU</text>

    <!-- Subtitle Roles -->
    <text x="1" y="78" class="sans-font" font-size="14px" font-weight="700" fill="#FFFFFF" letter-spacing="1.2px">
      AI &amp; ML ARCHITECT <tspan fill="#00F5D4">//</tspan> PYTHON <tspan fill="#00F5D4">//</tspan> DEEP LEARNING <tspan fill="#00F5D4">//</tspan> C++
    </text>

    <!-- Terminal Prompt Command Box -->
    <g transform="translate(0, 96)">
      <rect width="500" height="30" rx="5" fill="#0A101C" stroke="#1E2E4A" stroke-width="1.2" />
      <text x="12" y="19.5" class="mono-font" font-size="11.5px" font-weight="500" fill="#94A3B8">
        <tspan fill="#00F5D4">&gt;</tspan> Turning bold ideas into scalable, high-performance intelligent systems
      </text>
    </g>
  </g>

  <!-- RIGHT FLOATING CODE CARD -->
  <g transform="translate(565, 68)">
    <!-- Card Body -->
    <rect y="10" width="255" height="142" rx="8" fill="#090E1A" stroke="#1E2E4A" stroke-width="1.2" />

    <!-- Card Bottom-Right Accent Corner -->
    <path d="M 245 152 L 255 152 L 255 142" stroke="#A855F7" stroke-width="2" fill="none" />

    <!-- Top Badge Tab (Magenta border) -->
    <g transform="translate(12, 0)">
      <rect width="98" height="22" rx="5" fill="#161124" stroke="#F43F5E" stroke-width="1.2" />
      <text x="49" y="15" text-anchor="middle" class="mono-font" font-size="10.5px" font-weight="700" fill="#F43F5E">
        🎯 AI &amp; ML
      </text>
    </g>

    <!-- Filename to the right of tab -->
    <text x="120" y="16" class="mono-font" font-size="11px" font-weight="500" fill="#64748B">stack.json</text>

    <!-- JSON Snippet -->
    <g transform="translate(18, 42)" class="mono-font" font-size="11.5px">
      <text x="0" y="0" fill="#64748B">{</text>
      <text x="12" y="16" fill="#38BDF8">"core"<tspan fill="#64748B">:</tspan> <tspan fill="#A78BFA">"Python"</tspan><tspan fill="#64748B">,</tspan></text>
      <text x="12" y="32" fill="#38BDF8">"models"<tspan fill="#64748B">:</tspan> <tspan fill="#00F5D4">"PyTorch"</tspan><tspan fill="#64748B">,</tspan></text>
      <text x="12" y="48" fill="#38BDF8">"systems"<tspan fill="#64748B">:</tspan> <tspan fill="#F43F5E">"C / C++"</tspan></text>
      <text x="0" y="64" fill="#64748B">}</text>
    </g>

    <!-- Bottom Status Pill inside Card -->
    <g transform="translate(14, 118)">
      <rect width="227" height="24" rx="4" fill="#060A12" stroke="#1E2E4A" stroke-width="1" />
      <text x="113" y="16" text-anchor="middle" class="mono-font" font-size="10px" font-weight="700" fill="#94A3B8" letter-spacing="0.5px">
        STATUS: <tspan fill="#00F5D4">READY TO SHIP</tspan> 🚀
      </text>
    </g>
  </g>
</svg>
