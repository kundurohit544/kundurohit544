<svg width="100%" height="200" viewBox="0 0 850 200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#080c14" />
    </linearGradient>

    <!-- Wave 1 Gradient -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#00F5D4" stop-opacity="0.3" />
    </linearGradient>

    <!-- Wave 2 Gradient -->
    <linearGradient id="wave2Grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.6" />
    </linearGradient>

    <!-- Text Neon Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E2E8F0" />
      <stop offset="75%" stop-color="#00F5D4" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="cardGlow" x="-5%" y="-10%" width="110%" height="120%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      @keyframes waveFloat1 {
        0%, 100% { d: path("M 0,140 Q 212,110 425,140 T 850,140 L 850,200 L 0,200 Z"); }
        50% { d: path("M 0,140 Q 212,170 425,140 T 850,140 L 850,200 L 0,200 Z"); }
      }
      @keyframes waveFloat2 {
        0%, 100% { d: path("M 0,165 Q 212,185 425,160 T 850,165 L 850,200 L 0,200 Z"); }
        50% { d: path("M 0,165 Q 212,145 425,170 T 850,165 L 850,200 L 0,200 Z"); }
      }
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.85; filter: drop-shadow(0 0 12px rgba(0,245,212,0.4)); }
        50% { opacity: 1; filter: drop-shadow(0 0 24px rgba(0,245,212,0.85)); }
      }
      @keyframes starTwinkle {
        0%, 100% { opacity: 0.2; transform: scale(0.8); }
        50% { opacity: 0.9; transform: scale(1.3); }
      }
      @keyframes badgeShine {
        0%, 100% { stroke-dashoffset: 0; }
        50% { stroke-dashoffset: 60; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 52px;
        letter-spacing: 2px;
        animation: pulseGlow 4s ease-in-out infinite;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 500;
        font-size: 19px;
        letter-spacing: 4px;
        fill: #94A3B8;
      }
      .tag-text {
        font-family: 'SF Mono', Monaco, Consolas, 'Liberation Mono', 'Courier New', monospace;
        font-size: 13px;
        font-weight: 600;
        fill: #00F5D4;
        letter-spacing: 1.5px;
      }
      .star1 { animation: starTwinkle 3s ease-in-out infinite; transform-origin: 120px 45px; }
      .star2 { animation: starTwinkle 4s ease-in-out infinite 1s; transform-origin: 730px 50px; }
      .star3 { animation: starTwinkle 2.5s ease-in-out infinite 0.5s; transform-origin: 220px 105px; }
      .star4 { animation: starTwinkle 3.5s ease-in-out infinite 1.5s; transform-origin: 660px 110px; }
      .wave1 { animation: waveFloat1 6s ease-in-out infinite; }
      .wave2 { animation: waveFloat2 5s ease-in-out infinite; }
    </style>
  </defs>

  <!-- Card Background with rounded corners and border -->
  <rect width="850" height="200" rx="16" fill="url(#bgGrad)" />
  <rect width="848" height="198" x="1" y="1" rx="15" fill="none" stroke="#1E293B" stroke-width="1.5" />

  <!-- Animated Decorative Stars / Tech Particles -->
  <circle cx="120" cy="45" r="2" fill="#00F5D4" class="star1" />
  <circle cx="730" cy="50" r="2.5" fill="#38BDF8" class="star2" />
  <circle cx="220" cy="105" r="1.5" fill="#A78BFA" class="star3" />
  <circle cx="660" cy="110" r="2" fill="#00F5D4" class="star4" />
  <circle cx="780" cy="95" r="1.5" fill="#E2E8F0" class="star1" />
  <circle cx="90" cy="115" r="1.5" fill="#38BDF8" class="star2" />

  <!-- Top Center Accent Tag -->
  <g transform="translate(345, 18)">
    <rect width="160" height="24" rx="12" fill="#1E293B" stroke="#00F5D4" stroke-opacity="0.4" stroke-width="1" />
    <circle cx="15" cy="12" r="4" fill="#00F5D4">
      <animate attributeName="opacity" values="0.4;1;0.4" dur="2s" repeatCount="indefinite" />
    </circle>
    <text x="26" y="16.5" class="tag-text">AI / ML SPECIALIST</text>
  </g>

  <!-- Main Animated Waves at Bottom -->
  <path class="wave1" fill="url(#wave1Grad)" d="M 0,140 Q 212,110 425,140 T 850,140 L 850,200 L 0,200 Z" />
  <path class="wave2" fill="url(#wave2Grad)" d="M 0,165 Q 212,185 425,160 T 850,165 L 850,200 L 0,200 Z" />

  <!-- Main Name Header -->
  <g text-anchor="middle">
    <text x="425" y="98" fill="url(#titleGrad)" class="title-text">ROHIT KUNDU</text>
    <text x="425" y="132" class="subtitle-text">B.TECH · ARTIFICIAL INTELLIGENCE &amp; MACHINE LEARNING</text>
  </g>
</svg>
