<svg width="100%" height="185" viewBox="0 0 410 185" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E0A1A" />
      <stop offset="100%" stop-color="#070512" />
    </linearGradient>

    <pattern id="cardGrid2" width="18" height="18" patternUnits="userSpaceOnUse">
      <path d="M 18 0 L 0 0 0 18" fill="none" stroke="#A855F7" stroke-opacity="0.05" stroke-width="0.8" />
    </pattern>

    <style>
      .mono { font-family: 'SF Mono', Monaco, Consolas, monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes pulseDotPurple {
        0%, 100% { opacity: 0.4; }
        50% { opacity: 1; }
      }
      @keyframes glowBorderPurple {
        0%, 100% { stroke-opacity: 0.4; }
        50% { stroke-opacity: 0.9; filter: drop-shadow(0 0 6px rgba(168, 85, 247, 0.5)); }
      }
      .purple-dot { animation: pulseDotPurple 2s infinite ease-in-out; }
      .border-anim-purple { animation: glowBorderPurple 3s infinite ease-in-out; }
    </style>
  </defs>

  <!-- Card Background -->
  <rect width="410" height="185" rx="10" fill="url(#bg2)" stroke="#2D1B4E" stroke-width="1.2" />
  <rect width="410" height="185" rx="10" fill="url(#cardGrid2)" />

  <!-- Animated Corner Brackets -->
  <path d="M 10 24 L 10 10 L 24 10" stroke="#A855F7" stroke-width="2" stroke-linecap="round" fill="none" class="border-anim-purple" />
  <path d="M 386 10 L 400 10 L 400 24" stroke="#A855F7" stroke-width="2" stroke-linecap="round" fill="none" class="border-anim-purple" />
  <path d="M 10 161 L 10 175 L 24 175" stroke="#EC4899" stroke-width="2" stroke-linecap="round" fill="none" class="border-anim-purple" />
  <path d="M 386 175 L 400 175 L 400 161" stroke="#EC4899" stroke-width="2" stroke-linecap="round" fill="none" class="border-anim-purple" />

  <!-- Header: Title & Status Badge -->
  <g transform="translate(20, 24)">
    <text x="0" y="8" class="sans" font-size="17px" font-weight="800" fill="#FFFFFF">
      📱 APKs Vault &amp; AppVault
    </text>

    <!-- Status Pill -->
    <g transform="translate(245, -8)">
      <rect width="115" height="22" rx="11" fill="#18112C" stroke="#A855F7" stroke-opacity="0.4" stroke-width="1" />
      <circle cx="12" cy="11" r="3.5" fill="#A855F7" class="purple-dot" />
      <text x="22" y="14.5" class="mono" font-size="9.5px" font-weight="700" fill="#A855F7" letter-spacing="0.5px">REPOSITORY</text>
    </g>
  </g>

  <!-- Tech Badges -->
  <g transform="translate(20, 52)">
    <rect width="70" height="19" rx="4" fill="#20133A" stroke="#2D1B4E" stroke-width="1" />
    <text x="35" y="13" text-anchor="middle" class="mono" font-size="9.5px" font-weight="600" fill="#EC4899">ANDROID</text>

    <rect x="76" width="95" height="19" rx="4" fill="#20133A" stroke="#2D1B4E" stroke-width="1" />
    <text x="123" y="13" text-anchor="middle" class="mono" font-size="9.5px" font-weight="600" fill="#A855F7">DISTRIBUTION</text>

    <rect x="177" width="75" height="19" rx="4" fill="#20133A" stroke="#2D1B4E" stroke-width="1" />
    <text x="214" y="13" text-anchor="middle" class="mono" font-size="9.5px" font-weight="600" fill="#94A3B8">STORAGE</text>
  </g>

  <!-- Description Text -->
  <text x="20" y="94" class="sans" font-size="12px" fill="#94A3B8">
    <tspan x="20" dy="0">Structured storage, version management, and instant distribution</tspan>
    <tspan x="20" dy="16">hub for verified Android APK applications and package releases.</tspan>
  </text>

  <!-- Bottom Action Button Bar -->
  <g transform="translate(20, 136)">
    <rect width="370" height="28" rx="6" fill="#130D24" stroke="#2D1B4E" stroke-width="1" />
    <text x="185" y="18" text-anchor="middle" class="mono" font-size="11px" font-weight="700" fill="#A855F7" letter-spacing="0.8px">
      ACCESS VAULT ➜
    </text>
  </g>
</svg>
