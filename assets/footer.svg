<svg width="100%" height="80" viewBox="0 0 850 80" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="footerWaveGrad1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#7928CA" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.3" />
    </linearGradient>
    <linearGradient id="footerWaveGrad2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#7928CA" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#00F5D4" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#4F46E5" stop-opacity="0.6" />
    </linearGradient>
    <style>
      @keyframes footWave1 {
        0%, 100% { d: path("M 0,20 Q 212,50 425,20 T 850,20 L 850,80 L 0,80 Z"); }
        50% { d: path("M 0,40 Q 212,10 425,40 T 850,40 L 850,80 L 0,80 Z"); }
      }
