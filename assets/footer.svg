      .fwave2 { animation: footWave2 6s ease-in-out infinite; }
    </style>
  </defs>
  <path class="fwave1" fill="url(#footerWaveGrad1)" d="M 0,20 Q 212,50 425,20 T 850,20 L 850,80 L 0,80 Z" />
  <path class="fwave2" fill="url(#footerWaveGrad2)" d="M 0,35 Q 212,15 425,35 T 850,35 L 850,80 L 0,80 Z" />
