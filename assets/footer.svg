<svg width="100%" height="130" viewBox="0 0 920 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#060913" />
      <stop offset="50%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#050811" />
    </linearGradient>

    <!-- Top Neon Line Gradient -->
    <linearGradient id="neonLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.1" />
      <stop offset="15%" stop-color="#00F5D4" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="85%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Filter for Top Divider -->
    <filter id="lineGlow" x="-10%" y="-100%" width="120%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <style>
      .mono-font {
        font-family: 'SF Mono', Monaco, 'Cascadia Code', 'Courier New', monospace;
      }
      .sans-font {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif;
      }
      @keyframes pillGlow {
        0%, 100% { filter: drop-shadow(0 0 6px rgba(0, 245, 212, 0.3)); }
        50% { filter: drop-shadow(0 0 14px rgba(0, 245, 212, 0.7)); }
      }
      .brand-capsule {
        animation: pillGlow 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Container Box -->
  <rect width="920" height="130" rx="14" fill="url(#footerBg)" stroke="#172033" stroke-width="2" />

  <!-- Top Glowing Neon Laser Divider -->
  <line x1="20" y1="2" x2="900" y2="2" stroke="url(#neonLineGrad)" stroke-width="2.5" filter="url(#lineGlow)" stroke-linecap="round" />

  <g text-anchor="middle" transform="translate(460, 0)">
    <!-- Primary Bold Heading -->
    <text x="0" y="42" class="sans-font" font-size="16px" font-weight="900" fill="#FFFFFF" letter-spacing="2.5px">
      KEEP BUILDING. KEEP BREAKING. KEEP LEARNING.
    </text>

    <!-- Subtitle Note -->
    <text x="0" y="66" class="sans-font" font-size="12.5px" font-weight="400" fill="#94A3B8" letter-spacing="0.5px">
      Crafted with precision &amp; passion for intelligent systems • Thanks for exploring
    </text>

    <!-- Bottom Brand Capsule: </rohit.kundu> -->
    <g transform="translate(-80, 82)" class="brand-capsule">
      <rect width="160" height="30" rx="6" fill="#0D1424" stroke="#00F5D4" stroke-opacity="0.8" stroke-width="1.2" />
      <text x="80" y="19.5" text-anchor="middle" class="mono-font" font-size="13px" font-weight="700" fill="#00F5D4" letter-spacing="1px">
        &lt;/rohit.kundu&gt;
      </text>
    </g>
  </g>
</svg>
