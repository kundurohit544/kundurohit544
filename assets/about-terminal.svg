<svg width="100%" height="250" viewBox="0 0 850 250" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="termBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <style>
      .term-text {
        font-family: 'SF Mono', Monaco, 'Cascadia Code', Consolas, 'Courier New', monospace;
        font-size: 13.5px;
        line-height: 1.6;
      }
      .cmd-prompt { fill: #00F5D4; font-weight: 700; }
      .cmd-text { fill: #F8FAFC; font-weight: 600; }
      .out-key { fill: #38BDF8; font-weight: 500; }
      .out-val { fill: #E2E8F0; }
      .out-str { fill: #A78BFA; }
      .out-hl { fill: #FCD34D; }
      .cursor {
        animation: blink 1s step-end infinite;
      }
      @keyframes blink {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
    </style>
  </defs>

  <!-- Terminal Window Background -->
  <rect width="850" height="250" rx="12" fill="url(#termBg)" stroke="#334155" stroke-width="1.5" />

  <!-- Terminal Title Bar -->
  <path d="M 0,12 Q 0,0 12,0 L 838,0 Q 850,0 850,12 L 850,38 L 0,38 Z" fill="url(#headerGrad)" />
  <line x1="0" y1="38" x2="850" y2="38" stroke="#334155" stroke-width="1" />

  <!-- Window Buttons (macOS style) -->
  <circle cx="24" cy="19" r="6" fill="#EF4444" />
  <circle cx="44" cy="19" r="6" fill="#F59E0B" />
  <circle cx="64" cy="19" r="6" fill="#10B981" />

  <!-- Window Title -->
  <text x="425" y="24" text-anchor="middle" fill="#94A3B8" font-family="'SF Mono', Monaco, monospace" font-size="12px" font-weight="600">rohit@neuro-station: ~/profile (zsh)</text>

  <!-- Terminal Content Lines -->
  <g transform="translate(25, 68)" class="term-text">
    <!-- Line 1: whoami -->
    <text x="0" y="0">
      <tspan class="cmd-prompt">➜ </tspan>
      <tspan class="cmd-prompt">~ </tspan>
      <tspan class="cmd-text">whoami</tspan>
    </text>
    <text x="18" y="22" class="out-val">
      Rohit Kundu <tspan class="out-str">/* B.Tech Student in Artificial Intelligence &amp; Machine Learning */</tspan>
    </text>

    <!-- Line 2: current focus -->
    <text x="0" y="52">
      <tspan class="cmd-prompt">➜ </tspan>
      <tspan class="cmd-prompt">~ </tspan>
      <tspan class="cmd-text">rohit --focus</tspan>
    </text>
    <text x="18" y="74">
      <tspan class="out-key">Primary:</tspan> <tspan class="out-val">Deep Learning, Computer Vision &amp; AI Pipelines</tspan>
      <tspan class="out-key"> | Stack:</tspan> <tspan class="out-hl">[Python, C++, C, JavaScript]</tspan>
    </text>

    <!-- Line 3: philosophy -->
    <text x="0" y="104">
      <tspan class="cmd-prompt">➜ </tspan>
      <tspan class="cmd-prompt">~ </tspan>
      <tspan class="cmd-text">rohit --philosophy</tspan>
    </text>
    <text x="18" y="126" class="out-str">
      "Code is like humor. When you have to explain it, it’s bad."
    </text>

    <!-- Line 4: prompt with blinking cursor -->
    <text x="0" y="156">
      <tspan class="cmd-prompt">➜ </tspan>
      <tspan class="cmd-prompt">~ </tspan>
      <tspan fill="#00F5D4" class="cursor">▊</tspan>
    </text>
  </g>
</svg>
